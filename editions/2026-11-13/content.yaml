  - id: nvidia-ceo-exit
    section: brief
    kind: news
    headline: "Jensen Huang resigns as Nvidia CEO after 33 years; CFO Colette Kress is named interim CEO"
    dek: "It's effective immediately, five days before Nvidia's earnings. The stock fell as much as 13% before closing down 4.3%."
    summary: >-
      Nvidia's 8-K says Colette Kress, executive vice president and CFO, will serve as interim CEO while keeping her CFO
      role until a permanent successor is named. The board is considering internal and external candidates. The
      departure followed the board's investigation, opened on 8 November, into reports that Huang was targeted by a
      foreign intelligence effort. Nvidia gave no reason in its announcement. The broader market recovered most of its
      early losses.
    why: >-
      This removes the founder-CEO of the world's most important AI chip company during an earnings week. Questions
      about strategy, China policy and customer relationships will dominate Tuesday's call.
    me: >-
      For your AMD and AVGO positions, analysts are asking whether Nvidia's turmoil sends business to rivals. Yahoo's
      headline said AMD and Broadcom rose on Thursday. Nvidia's report on Tuesday is now the event of the month for
      your chip exposure.
    inference: "Our read: the 'Nvidia rivals benefit' argument is analyst speculation. Customers rarely switch chip platforms quickly."
    event_date: 2026-11-12
    sources:
