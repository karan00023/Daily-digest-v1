  # ───────────── BRIEF ─────────────
  - id: ai-bill
    section: brief
    kind: news
    headline: "The AI bill comes due: Alphabet has its worst day on record, Amazon and Intel sink after hours"
    dek: "Cloud revenue is booming everywhere. Investors are now punishing the cash it takes to build it."
    summary: >-
      Alphabet fell about 12% on Thursday after Q3 free cash flow came in at negative $9.1 billion on $51.4 billion
      of capex, even though Google Cloud revenue roughly doubled to $30.7 billion. Microsoft went the other way:
      Azure grew 48% and capex came in lighter than expected, and shares rose after hours on Wednesday. After
      Thursday's close, Amazon fell 7–12% (an EPS miss and about $220 billion of planned capex, despite AWS +39%),
      and Intel dropped about 20% on weak guidance. Nasdaq futures traded about 2% lower overnight.
    why: >-
      For two years the market rewarded AI spending. This week it began separating spending that pays back now
      (Microsoft) from spending that burns cash (Alphabet, Amazon). That shift drives everything from chip stocks to cloud pricing.
    me: >-
      This hits your core holdings at once: GOOGL (the sharpest drop), MSFT (the winner), and AVGO and AMD (chip
      suppliers caught in the selloff, with AMD reporting Tuesday). The market is now asking for AI that pays for
      itself, which is also the argument you make in FinOps at work.
    inference: "Our read: the divergence is about cash flow, not demand. Every cloud grew faster than expected."
    event_date: 2026-10-29
    sources:
      - {name: "CNBC — Alphabet Q3 2026 earnings", url: "https://www.cnbc.com/2026/10/28/alphabet-googl-earnings-q3-2026.html", published: "2026-10-28"}
      - {name: "CNBC — Microsoft jumps as cloud growth drives beat", url: "https://www.cnbc.com/2026/10/28/microsoft-msft-q1-earnings-report-2027.html", published: "2026-10-28"}
