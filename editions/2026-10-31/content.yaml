  - id: rupee-best-month
    section: india
    kind: news
    headline: "Rupee posts its best month in eight, closing near 94.93 per dollar, as RBI curbs on dollar demand take hold"
    dek: "Reserves stand at $719.75B. Bank lending rates eased to 8.51% in September."
    summary: >-
      The rupee rose 33 paise on Friday to about 94.93, helped by the RBI's moves to keep oil companies' dollar buying
      out of the spot market and to tighten hedging rules. The RBI also raised rates in October, its first increase in
      nearly four years, and has signalled more may follow. Forex reserves fell $1.27 billion to $719.75 billion.
    why: "The rupee's slide from near 97 has paused, but analysts still see oil as the main risk."
    me: "If you're sending money to India, the rupee has recovered from its lows, so dollars buy slightly less than they did mid-October."
