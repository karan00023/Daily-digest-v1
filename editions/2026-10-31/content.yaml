stories:
  - id: october-rout
    section: brief
    kind: news
    headline: "October ends with the worst day since June: Nasdaq −2.9%, Intel −28.6%, Nasdaq-100 in correction"
    dek: "A third straight weekly loss for the S&P 500 as the AI-spending repricing spread from Alphabet and Amazon to chips."
    summary: >-
      The S&P 500 fell 1.82% to 7,580.07 on Friday and the Nasdaq fell 2.86% to 25,437.00. Intel lost about 28.6% to
      $65.76, its worst day since the 1970s, after guiding Q4 adjusted EPS to $0.25 against a $0.43 estimate. Amazon
      also fell after its miss and higher capex guidance. Treasuries and oil rallied while gold fell below $4,000.
    why: >-
      A correction in the Nasdaq-100 means the market is no longer giving AI spending the benefit of the doubt.
      Expect volatility into Tuesday, which brings both the midterms and AMD's results.
    me: >-
      Most of your holdings sit in this selloff's path (AMD, AVGO, GOOGL, MSFT, ORCL, TSLA). Your diversifiers behaved
      differently: Treasuries rallied, but gold (GLD) fell too, so it didn't act as a hedge this week.
    inference: "Our read: this is a valuation reset on AI capex, not a demand collapse. Cloud growth this week was strong everywhere."
    event_date: 2026-10-30
    sources:
      - {name: "TheStreet — Stock market today, 30 Oct", url: "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-30-2026", published: "2026-10-30"}
