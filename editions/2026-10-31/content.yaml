    summary: >-
      MS NOW, as summarised by Political Wire, reported that the administration briefed Gulf allies to prepare for a
      short, intense round of strikes as soon as the day after Tuesday's midterms. A White House official said
      election results will not factor into the decision. Iran claimed four tankers struck mines in the Strait of
      Hormuz, which the US disputes, and WTI settled near $104.
    why: "Renewed strikes would hit oil, which feeds US inflation, the December Fed decision and the rupee."
    me: "Oil above $100 also pushes up airfares. If you're planning a Delhi trip, book sooner rather than later."
    inference: "These are reports of plans, not announcements. Treat the timing as unconfirmed."
