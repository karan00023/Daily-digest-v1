    kind: news
    headline: "BigQuery can now query Databricks, Snowflake and AWS Glue tables in place through Iceberg REST catalogs"
    dek: "Federation instead of copying data, which is good news for multi-platform data estates."
    summary: >-
      Google Cloud outlined a way for BigQuery to query data held in Databricks, Snowflake and AWS Glue
      without moving it, using federated Apache Iceberg REST catalog connections. Coverage is dated
      26–27 October; check BigQuery's release notes for GA vs. preview status.
    why: >-
      Open table formats are becoming the neutral layer between warehouses, so the choice of engine is
      no longer a data-migration decision. Expect pricing and governance, not storage, to decide who wins workloads.
    me: "This is your core domain: data platforms, architecture and FinOps."
    use: >-
      Build a one-afternoon proof of concept: register one Iceberg table from a Databricks or Snowflake
      catalog in BigQuery and compare query cost and latency against your current copy-based pipeline.
      You get a FinOps number for your roadmap and a demo for leadership.
    linkedin: "“The end of the copy pipeline?” A hands-on look at cross-platform Iceberg federation, with real cost numbers."
    event_date: 2026-10-26
    sources:
