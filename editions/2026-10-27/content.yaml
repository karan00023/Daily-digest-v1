    kind: news
    headline: "Warsh's Fed opens a two-day meeting with inflation at 3.7% and hiring stalling"
    dek: "A hold is priced in for Wednesday; the press conference decides whether December brings a hike."
    summary: >-
      The FOMC began its 27–28 October meeting this morning; futures put roughly a 91% chance on
      no change and about 9% on a 25 bp hike. September CPI rose 3.7% year on year (core 2.6%) while
      payrolls grew just 29,000 and unemployment held at 4.2%. There is no new dot plot this time, so
      Chair Kevin Warsh's 2:30 p.m. press conference carries the signal.
    why: >-
      Hot headline inflation and weak hiring pull in opposite directions. UBS expects 25 bp hikes in
      December and March; a hawkish tone would keep the 10-year near 5% and mortgage rates above 7%.
    me: >-
      Your land search and any future construction loan price off these rates — a December hike would
      lift financing costs before you buy. Rate-sensitive, long-duration holdings (TSLA, MSTR, RCAT,
      OCGN) tend to react most to a hawkish surprise; FDRXX yields would follow policy rates up.
    inference: "Our read: the risk is skewed hawkish. Inflation is gasoline-led, but a 3.7% print is hard for a new chair to look through."
    event_date: 2026-10-28
