  - id: marvell-lumentum
    section: tech
    kind: news
    headline: "Marvell agrees to buy Lumentum in an all-stock deal valuing it near $115B, and Marvell shares fall 12.7%"
    dek: "Optical networking is becoming the next bottleneck in AI data centres."
    summary: >-
      Marvell will pay about a 24% premium for Lumentum, a maker of optical components used in AI data-centre
      networking. Investors balked at the price. Lumentum was trading at about a fifth of that valuation a year ago,
      and Marvell closed at $171.41.
    why: "Chipmakers are buying their way into the optical interconnects that link AI clusters, a market where Broadcom competes."
    me: "Relevant to AVGO's networking franchise, and a sign the AI build-out is shifting from GPUs to the plumbing between them."
    use: "For infrastructure planning, data-centre network bandwidth (not just compute) is increasingly the cost and lead-time constraint to model."
