    headline: "Apple beats with $114.5B in revenue and a record September-quarter iPhone, but futures slip as investors find the report disappointing"
    dek: "The S&P 500 fell for a third straight day to its lowest close since 31 July."
    summary: >-
      Apple's fiscal Q4 revenue was about $114.5 billion and diluted EPS $2.10 (+14%), ahead of a roughly $113.4
      billion and $1.99 consensus. iPhone revenue rose 17% to $57.6 billion. It was CEO John Ternus's first call,
      and memory costs were a focus. On Monday the Nasdaq fell 1.07% as chip stocks slid (the SOX fell more than 3%).
      Futures were lower early Tuesday.
    why: "Rising memory-chip costs are a margin question for every hardware maker, and a pricing signal for chip suppliers."
