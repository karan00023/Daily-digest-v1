  - id: dems-sweep
    section: brief
    kind: news
    headline: "Democrats win both the House and the Senate, taking full control of Congress for the first time since 2023"
    dek: "Susan Collins is projected to lose in Maine. Democrats flip Senate seats in North and South Carolina."
    summary: >-
      AP race calls and network projections show Democrats winning majorities in both chambers. Republicans had
      entered the year with a 53–47 Senate majority. In the House, one outlet projects Democrats at 250 or more seats.
      Futures slid overnight on worries about tighter data-centre regulation, then recovered, with ING noting the
      new Congress isn't seated until January.
    why: >-
      Divided government from January means more oversight of the Iran war, tariffs and AI infrastructure, and less
      room for new tax legislation. Markets tend to like gridlock, but AI regulation is a new wildcard.
    me: >-
      The overnight dip was concentrated in AI and data-centre names, which describes most of your holdings. Watch
      whether that worry about data-centre regulation lingers at the open.
    inference: "Seat counts are projections and may change as remaining races are called."
    event_date: 2026-11-03
    sources:
