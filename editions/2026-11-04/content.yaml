  - id: qeshm-strike
    section: brief
    kind: news
    headline: "US carries out a limited strike on Iran's Qeshm Island even as talks continue"
    dek: "Officials call it defensive. Vance says he's hopeful about a settlement, and oil barely moved."
    summary: >-
      The Wall Street Journal, citing US officials, reported a strike on Iran's Qeshm Island on Monday. Officials said it
      responded to Iranian surface-to-air missile use and was deliberately kept small. Iran said contacts to end the war
      continue, though talks through Qatari mediators produced no breakthrough. Brent rose only about 0.3% on the report.
    why: "The muted oil reaction suggests markets see this as part of ongoing low-level operations, not a return to full-scale war."
    me: "It doesn't change the picture for your GLD hedge or travel plans yet. The diplomacy track matters more."
    event_date: 2026-11-03
