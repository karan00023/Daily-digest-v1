    kind: news
    headline: "New Jersey: Booker re-elected, and Democrat Rebecca Bennett unseats Tom Kean Jr. in NJ-7"
    dek: "NJ-2 (Van Drew vs. Mullock) was still close at last count."
    summary: >-
      CBS New York reports Senator Cory Booker beat Republican Justin Murphy, and Rebecca Bennett defeated Rep. Tom Kean
      Jr. in the state's most competitive House race. Republican Chris Smith held NJ-4. In NJ-2, Democrat Zack Mullock, the
      Cape May mayor, led incumbent Jeff Van Drew in partial counts.
    why: "NJ-7 was one of the seats that helped flip the House."
