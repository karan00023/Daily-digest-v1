    summary: >-
      Provisional Finance Ministry data show gross GST collections of about ₹2.31 lakh crore in October, up 22.9% from
      a year earlier. Net collections after refunds rose 25.6%. April–October collections are up 13.2%.
    why: "Strong tax receipts give the government fiscal room while the RBI tightens to defend the rupee."
    me: "It's a sign of solid Indian consumer demand. Part of the import-GST jump reflects higher oil prices, not volume."
    inference: "The oil-price point is our inference."
