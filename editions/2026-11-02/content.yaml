  - id: ai-optout-standard
    section: tech
    kind: news
    headline: "OpenAI, Google, Microsoft and Anthropic agree to honour one robots.txt signal for opting out of AI training"
    dek: "A single token, __usage_ai-training. Google's version also affects grounding in Gemini and Vertex AI."
    summary: >-
      Announced on 30 October, the voluntary standard lets publishers block AI training with one robots.txt entry.
      Anthropic has reportedly adopted it already, while Google and Microsoft plan support in 2027 and OpenAI has yet
      to publish details. Microsoft also introduced a separate "AI Grounding" setting that controls whether pages can
      feed answers in Bing, Copilot and Microsoft 365. Meta hasn't committed.
    why: "Training and grounding are now separate controls, which data-governance teams have long asked for."
    me: "If your company publishes documentation or data externally, there's now a decision to make about training versus grounding."
    use: >-
      Draft a one-page policy note for your web and data teams: which public content to keep available for grounding
      (search answers, Copilot) but exclude from training, and the exact robots.txt entries for each vendor.
    linkedin: "“Training versus grounding: the AI content control enterprises actually needed.” A practical robots.txt guide."
    inference: "Disclosure: Claude is made by Anthropic, one of the four companies."
    event_date: 2026-10-30
    sources:
      - {name: "H2S Media — Google, OpenAI, Microsoft and Anthropic agree on one AI training opt-out", url: "https://www.how2shout.com/ai/shared-robots-txt-ai-training-opt-out-google-openai-microsoft-anthropic.html", published: "2026-10-31"}
      - {name: "Resultsense — Big AI firms back a shared opt-out signal", url: "https://www.resultsense.com/news/2026-11-02-ai-firms-shared-robots-training-signal/", published: "2026-11-02"}
    scores: {personal: 9, impact: 6, magnitude: 6, timeliness: 9, actionability: 8}
