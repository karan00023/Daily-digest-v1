  - id: ai-bills
    section: tech
    kind: analysis
    headline: "Democrats plan a wave of AI bills for January, but lack the 60 Senate votes to pass most of them"
    dek: "Expect oversight hearings before legislation. Senator Cantwell is pushing federal model testing."
    summary: >-
      Reporting says Democrats intend to move quickly on AI once they take control, but with about 54 Senate seats they
      are six short of the 60 needed to end debate on most bills. Analysts expect committee oversight of AI companies,
      including possible federal model-testing requirements, to come before any binding law. Fear of that agenda drove
      Thursday's chip selloff.
    why: "It suggests Thursday's selloff priced in more regulatory risk than Congress can actually deliver in 2027."
    me: "For your AI holdings this is a nuance worth knowing. For your work, model-testing and audit rules would directly affect enterprise AI deployments."
    use: >-
      Track the bills on two lists: those that could pass with 60 votes or by unanimous consent, and those that are
      likely only hearing material. A one-page tracker is useful for compliance planning at work and for judging
      portfolio risk.
    inference: "The 'priced in more than can pass' view is our analysis."
    event_date: 2026-11-06
    sources:
      - {name: "Detroit News — Democrats planning flood of AI bills", url: "https://detroitnews.com/story/tech/2026/11/06/democrats-planning-flood-of-ai-bills-when-they-take-control-of-congress/92641085007", published: "2026-11-06"}
