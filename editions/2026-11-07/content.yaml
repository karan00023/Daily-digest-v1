    kind: news
    headline: "Payrolls jump by 165,000 in October, nearly triple forecasts, and unemployment falls to 4.1%"
    dek: "A strong labour market gives the Fed room to hike in December. Yields rose."
    summary: >-
      The BLS reported nonfarm payrolls rose 165,000 against a roughly 65,000 consensus, and September was revised to
      60,000. Unemployment fell to 4.1%, participation edged up to 61.9%, and wage growth was slightly hotter than
      expected. Gains came in professional services, health care and transportation.
    why: "With inflation at 3.6–3.7% and hiring strong, the Fed has little reason to wait. Strong data pushed December hike odds higher."
    me: >-
      This is good for the economy but bad for rate-sensitive holdings and for land financing. It could halt the
      three-week decline in mortgage rates.
    inference: "Our read: a December hike now looks more likely than not, though CPI on Tuesday could still change that."
    event_date: 2026-11-06
